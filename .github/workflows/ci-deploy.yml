name: チェック・デプロイ

# PR を出す/更新する → チェック → プレビュー環境に公開
# main にマージ        → チェック → 本番に公開
# PR を閉じる          → プレビュー環境を削除
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # プレビューURLをPRにコメントするため

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-deploy:
    name: チェックと公開
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      # 他人のフォーク（外部）からの PR では公開しない
      CAN_DEPLOY: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # PR の変更内容を比べるため

      - name: ④ 変更範囲（自分のアプリのフォルダ以外を変更していないか）
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node tools/check-scope.mjs HEAD^1

      - name: 秘密情報（パスワード・APIキー等）が書かれていないか
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          dir /repo --redact --verbose --exit-code 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: アプリの申告（app.manifest.json）
        run: npm run check:manifests

      - name: ⑤ 禁止パターン（外部送信・eval・HTMLの直接書き込み・認証処理 等）
        run: npm run check:safety

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - name: ⑦ 起動確認（ブラウザで開き、エラー・外部通信・CSP違反がないか）
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: デプロイ用トークンの確認
        if: env.SWA_TOKEN == ''
        run: echo "::warning::AZURE_STATIC_WEB_APPS_API_TOKEN が未登録のため公開をスキップしました（README の「デモの準備」を参照）"

      - name: ${{ github.event_name == 'push' && '本番に公開' || 'プレビュー環境に公開' }}
        id: deploy
        if: env.SWA_TOKEN != '' && env.CAN_DEPLOY == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          # repo_token は渡さない（渡すと Azure がポータルのトップ URL を PR にコメントする）。
          # プレビュー1の URL は、次のステップでアプリのページを直接コメントする。
          action: upload
          app_location: dist
          skip_app_build: true
          # 基盤の API（Azure Functions）。管理者が管理する api/ をそのまま載せる（依存関係は Azure 側でインストール）
          api_location: api

      - name: PR にプレビュー1（アプリのページ）の URL をコメントする
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SITE: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          site="${SITE%/}"
          # この PR で変更されたアプリ（apps/<部署コード>/<アプリ名>/）のページ。アプリ以外の変更だけならトップページ
          apps=$(git diff --name-only HEAD^1 HEAD | sed -nE 's#^apps/([^_/][^/]*)/([^/]+)/.*#\1/\2#p' | sort -u)
          if [ -n "$apps" ]; then
            urls=$(printf '%s\n' $apps | sed "s#^#- ${site}/#; s#\$#/#")
          else
            urls="- ${site}/"
          fi
          marker='<!-- preview1-url -->'
          body=$(printf '%s\n%s\n\n%s\n\n%s' \
            "$marker" \
            "**プレビュー1（部内テスト用）に公開しました**" \
            "$urls" \
            "コミット：\`${GITHUB_SHA:0:7}\`（push するたびにこのコメントを更新します）")
          # 前回のコメントがあれば更新し、なければ新しくコメントする（push のたびにコメントが増えないように）
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  close-preview:
    name: プレビュー環境を削除
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: dist
